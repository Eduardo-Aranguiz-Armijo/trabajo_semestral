spring.application.name=catalog-service
server.port=8090

app.gateway.url=http://localhost:8082

# Configuración MySQL (Corregido: eliminada la referencia a Oracle)
spring.datasource.url=jdbc:mysql://localhost:3306/catalogos_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# JPA (Corregido: quitado el dialecto de Oracle para que Spring Boot autodetecte MySQL)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.secret=una_clave_secreta_larga_y_segura_de_al_menos_32_bytes