spring.application.name=payment
server.port=8087

app.gateway.url=http://api-gateway

# Base de datos (Corregido: Ahora crea 'payment_db' de forma automÃ¡tica si no existe)
spring.datasource.url=jdbc:mysql://localhost:3307/payment_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
jwt.secret=una_clave_secreta_larga_y_segura_de_al_menos_32_bytes

# Solución para incompatibilidad Spring Boot 3.5.3 + SpringDoc + HATEOAS
springdoc.hateoas.enabled=false
