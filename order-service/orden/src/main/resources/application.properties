spring.application.name=orden
server.port=8088

app.gateway.url=http://localhost:8082

# Base de datos (Se agregó el parámetro para crearla automáticamente si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/orden_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=una_clave_secreta_larga_y_segura_de_al_menos_32_bytes