spring.application.name=product-service
# Puerto
server.port=8091

app.gateway.url=http://api-gateway

# Base de datos
spring.datasource.url=jdbc:mysql://localhost:3307/productos_db
spring.datasource.username=root
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=una_clave_secreta_larga_y_segura_de_al_menos_32_bytes

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Solución para incompatibilidad Spring Boot 3.5.3 + SpringDoc + HATEOAS
springdoc.hateoas.enabled=false
