spring.application.name=gateway
# Punto de entrada único para Postman y comunicación entre microservicios
server.port=8082

# Las rutas se definen en GatewayRoutesConfig.java
gateway.logging.enabled=true

# Mapa de puertos (cada microservicio usa un puerto distinto):
# 8081 auth | 8083 cart | 8084 inventory | 8085 notifications | 8086 comprobante
# 8087 payment | 8088 orders | 8089 customer | 8090 catalog | 8091 products
