spring.application.name=gateway
# Fijamos el puerto central del Gateway en el 8082 (limpio y operativo)
server.port=5995

# ===================================================================
# CONFIGURACIÓN DE RUTAS DEL GATEWAY (Spring Cloud Gateway MVC)
# ===================================================================

# 1. Microservicio: Usuarios / Auth (Puerto Real: 8081)
spring.cloud.gateway.mvc.routes[0].id=ms-users
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/v1/auth/**

# 2. Microservicio: Carrito (Puerto Real: 8082 interno chocaría, pero como Gateway usa 8082, el servicio se queda en 8082. NOTA: Si levantas Carrito e instalas en local, cámbialo al 8092 para evitar que colisione con el Gateway. Por ahora lo ruteamos al 8082)
spring.cloud.gateway.mvc.routes[1].id=carrito-service
spring.cloud.gateway.mvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/v1/cart/**

# 3. Microservicio: Catálogos (Puerto Real: 8083)
spring.cloud.gateway.mvc.routes[2].id=catalogos-service
spring.cloud.gateway.mvc.routes[2].uri=http://localhost:8083
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/v1/catalogos/**

# 4. Microservicio: Comprobante (Puerto Real: 8084)
spring.cloud.gateway.mvc.routes[3].id=comprobante-service
spring.cloud.gateway.mvc.routes[3].uri=http://localhost:8084
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/v1/comprobantes/**

# 5. Microservicio: Clientes / CustomerClient (Puerto Real: 8085)
spring.cloud.gateway.mvc.routes[4].id=customer-service
spring.cloud.gateway.mvc.routes[4].uri=http://localhost:8085
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/api/v1/customers/**

# 6. Microservicio: Inventario / Inventory (Puerto Real: 8086)
spring.cloud.gateway.mvc.routes[5].id=inventory-service
spring.cloud.gateway.mvc.routes[5].uri=http://localhost:8086
spring.cloud.gateway.mvc.routes[5].predicates[0]=Path=/api/v1/inventory/**

# 7. Microservicio: Notificaciones (Puerto Real: 8087)
spring.cloud.gateway.mvc.routes[6].id=notificaciones-service
spring.cloud.gateway.mvc.routes[6].uri=http://localhost:8087
spring.cloud.gateway.mvc.routes[6].predicates[0]=Path=/api/v1/notificaciones/**

# 8. Microservicio: Orden / Pedidos (Puerto Real: 8088)
spring.cloud.gateway.mvc.routes[7].id=orden-service
spring.cloud.gateway.mvc.routes[7].uri=http://localhost:8088
spring.cloud.gateway.mvc.routes[7].predicates[0]=Path=/api/v1/ordenes/**

# 9. Microservicio: Pagos / Payment (Puerto Real: 8089)
spring.cloud.gateway.mvc.routes[8].id=payment-service
spring.cloud.gateway.mvc.routes[8].uri=http://localhost:8089
spring.cloud.gateway.mvc.routes[8].predicates[0]=Path=/api/v1/pagos/**

# 10. Microservicio: Productos (Puerto Real: 8090)
spring.cloud.gateway.mvc.routes[9].id=productos-service
spring.cloud.gateway.mvc.routes[9].uri=http://localhost:8090
spring.cloud.gateway.mvc.routes[9].predicates[0]=Path=/api/v1/productos/**

# ===================================================================
# CONFIGURACIONES ADICIONALES
# ===================================================================
gateway.logging.enabled=true
