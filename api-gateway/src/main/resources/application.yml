spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: false

          routes:
            - id: ms-users
              uri: lb://ms-users
              predicates:
                - Path=/api/v1/auth/**

            - id: ms-customer
              uri: lb://ms-customer
              predicates:
                - Path=/api/v1/customer/**

            - id: ms-inventory
              uri: lb://ms-inventory
              predicates:
                - Path=/api/v1/inventory/**

            - id: ms-category
              uri: lb://ms-category
              predicates:
                - Path=/api/v1/categories/**

            - id: ms-product
              uri: lb://ms-product
              predicates:
                - Path=/api/v1/products/**

            - id: ms-cart
              uri: lb://ms-cart
              predicates:
                - Path=/api/v1/cart/**

            - id: ms-order
              uri: lb://ms-order
              predicates:
                - Path=/api/v1/orders/**

            - id: ms-payment
              uri: lb://ms-payment
              predicates:
                - Path=/api/v1/payments/**,/api/v1/payment-methods/**

server:
  port: 9090

